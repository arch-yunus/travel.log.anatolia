<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anadolu Seyahatnamesi - Dijital Seyir Defteri</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/banner.png" type="image/x-icon">
</head>
<body>
    <div class="app-container">
        <!-- Header Section -->
        <header class="glass">
            <div class="logo-section">
                <h1>ANADOLU SEYAHATNAMESİ</h1>
                <p>Seyyah Yazılımcının Yol Notları</p>
            </div>
            
            <div class="header-stats">
                <div class="header-stat-item">
                    <div class="label">Keşif İlerlemesi</div>
                    <div class="val" id="stats-percentage">%0.0</div>
                </div>
                <div class="header-stat-item">
                    <div class="label">İl Sayısı</div>
                    <div class="val" id="stats-progress">(0/81)</div>
                </div>
                <div style="width: 140px; margin-right: 16px;">
                    <div class="progress-bar-bg" style="height: 8px;">
                        <div class="progress-bar-fill" id="stats-progress-bar" style="width: 0%"></div>
                    </div>
                </div>
                
                <button class="map-toggle-btn" id="map-toggle-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                        <line x1="8" y1="2" x2="8" y2="18"></line>
                        <line x1="16" y1="6" x2="16" y2="22"></line>
                    </svg>
                    Keşif Haritasını Aç
                </button>
            </div>
        </header>

        <!-- Main Layout Grid -->
        <main class="main-layout">
            <!-- Sidebar Panel -->
            <aside class="sidebar glass" aria-label="Arama ve Şehir Listesi">
                <!-- Search -->
                <div class="search-wrapper">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" class="search-input" placeholder="Şehir veya bölge ara...">
                </div>

                <!-- Region Selector -->
                <div class="filters-section">
                    <div class="filters-label">Bölgeler</div>
                    <select id="region-select" class="region-select">
                        <option value="all">Tüm Bölgeler</option>
                    </select>
                </div>

                <!-- Scrollable Cities List -->
                <div style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
                    <div class="cities-list-title">Seyahat Rotalarım</div>
                    <div class="cities-list-container" id="cities-list">
                        <!-- Rendered by app.js -->
                    </div>
                </div>
            </aside>

            <!-- Main Content Viewport -->
            <section class="content-viewport glass" id="viewport-content" aria-label="Seyahat Detayları">
                <!-- Empty State / Loading -->
                <div class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <h3>Yükleniyor...</h3>
                    <p>Lütfen listeden bir şehir seçin.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Map Modal Overlay -->
    <div class="map-modal" id="map-modal" aria-modal="true" role="dialog">
        <div class="map-modal-container">
            <button class="close-modal-btn" id="close-modal-btn" aria-label="Kapat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <iframe src="travel_map.html" title="Seyahat İlerleme Haritası"></iframe>
        </div>
    </div>

    <!-- Data and Application Script Modules -->
    <script src="web_data.js"></script>
    <script src="app.js"></script>
</body>
</html>
